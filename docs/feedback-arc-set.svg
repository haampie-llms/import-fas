<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8b8b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/>
    </marker>
  </defs>

  <!-- edges -->
  <g stroke="#8b8b8b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="105" y1="110" x2="178" y2="110"/>   <!-- app.cli -> app.models -->
    <line x1="470" y1="95"  x2="402" y2="46"/>    <!-- app.views -> app.db -->
    <line x1="320" y1="45"  x2="252" y2="94"/>    <!-- app.db -> app.models -->
    <line x1="470" y1="125" x2="402" y2="174"/>   <!-- app.views -> app.auth -->
    <line x1="320" y1="175" x2="252" y2="126"/>   <!-- app.auth -> app.models -->
  </g>
  <!-- the minimum feedback arc set: one edge, on both cycles -->
  <line x1="290" y1="110" x2="428" y2="110" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="359" y="102" text-anchor="middle" fill="#d9534f" font-size="11">remove</text>

  <!-- nodes -->
  <g fill="none" stroke="#8b8b8b" stroke-width="1.5">
    <rect x="15"  y="95"  width="90"  height="30" rx="4"/>
    <rect x="180" y="95"  width="110" height="30" rx="4"/>
    <rect x="430" y="95"  width="110" height="30" rx="4"/>
    <rect x="305" y="15"  width="110" height="30" rx="4"/>
    <rect x="305" y="175" width="110" height="30" rx="4"/>
  </g>
  <g fill="#8b8b8b" text-anchor="middle">
    <text x="60"  y="115">app.cli</text>
    <text x="235" y="115">app.models</text>
    <text x="485" y="115">app.views</text>
    <text x="360" y="35">app.db</text>
    <text x="360" y="195">app.auth</text>
  </g>
</svg>
